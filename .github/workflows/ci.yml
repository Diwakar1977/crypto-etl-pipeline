name: Crypto ETL CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04

    # AWS region required by boto3 during unit-test collection
    env:
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1

    steps:

      # Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Setup Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # Setup Java 17 for PySpark
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # Verify Python
      - name: Verify Python Version
        run: |
          python --version
          python -m pip --version

      # Verify Java
      - name: Verify Java Version
        run: |
          java -version

      # Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # Install Project Dependencies
      - name: Install Project Dependencies
        run: |
          python -m pip install -r requirements.txt

      # Verify Important Dependencies
      - name: Verify Important Dependencies
        run: |
          python -c "import pytest; print('pytest:', pytest.__version__)"
          python -c "import pyspark; print('PySpark:', pyspark.__version__)"
          python -c "import boto3; print('boto3:', boto3.__version__)"

      # Verify AWS Region
      - name: Verify AWS Configuration
        run: |
          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

      # Check Project Structure
      - name: Check Project Structure
        run: |
          echo "Project root:"
          pwd

          echo ""
          echo "Top-level files and directories:"
          ls -la

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            ! -path "./venv/*" \
            ! -path "./__pycache__/*" \
            | sort

      # Run Unit Tests
      - name: Run Unit Tests
        run: |
          pytest tests/unit -v

      # Run Unit Tests With Coverage
      - name: Run Unit Tests With Coverage
        run: |
          pytest tests/unit \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      # Upload Coverage Report
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml